{# Set global_counter_variant to 'compact' before including on mobile #}
{% set compact = (global_counter_variant|default('full') == 'compact') %}
<div
    id="global-jaap-counter"
    class="{% if compact %}bg-orange-100/90 text-primary font-bold text-xs py-1.5 px-2 rounded-full inline-flex items-center gap-1 max-w-[5.5rem]{% else %}bg-orange-100 text-primary font-semibold text-sm py-1 px-3 rounded-full flex items-center{% endif %}"
    x-data="{ count: 0 }"
    x-init="
        fetch('{{ url('jaap:map_data') }}')
            .then(response => response.json())
            .then(data => { count = data.today_total })
            .catch(error => console.error('Error fetching global count:', error));

        setInterval(() => {
            fetch('{{ url('jaap:map_data') }}')
                .then(response => response.json())
                .then(data => { count = data.today_total })
                .catch(error => console.error('Error fetching global count:', error));
        }, 30000);
    "
>
    <i class="fas fa-globe-asia {% if not compact %}mr-1{% endif %} flex-shrink-0"></i>
    {% if not compact %}<span>Today:</span>{% endif %}
    <span class="{% if compact %}ml-0{% else %}ml-1{% endif %} font-bold tabular-nums truncate" x-text="count.toLocaleString()">0</span>
</div>
